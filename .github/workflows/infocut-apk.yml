name: InfoCut APK

on:
  push:
    paths:
      - 'InfoCut-Studio/**'
      - '.github/workflows/infocut-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InfoCut-Studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: InfoCut-Studio/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Build phone UI
        run: npm run build:mobile
      - name: Sync Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: InfoCut-Studio/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk InfoCut.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InfoCut-apk
          path: InfoCut-Studio/InfoCut.apk
