<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>InfoCut Bridge</title>
<style>
  :root { --bg: #232323; --panel: #2C2C2C; --line: #3A3A3A; --ink: #E6E6E6; --muted: #9A9A9A; --accent: #E0442E; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--ink); font: 12.5px/1.5 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; }
  h1 { font-size: 13px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h1::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  section { border-top: 1px solid var(--line); padding: 12px 0; }
  h2 { font-size: 12px; margin: 0 0 8px; color: var(--ink); }
  p { margin: 0 0 8px; color: var(--muted); }
  button { width: 100%; height: 30px; border-radius: 4px; border: 1px solid #4A4A4A; background: #3A3A3A; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #444; }
  button.primary { background: #E6E6E6; color: #1B1B1B; border-color: #E6E6E6; }
  button:disabled { opacity: .45; cursor: default; }
  select { width: 100%; height: 30px; border-radius: 4px; border: 1px solid #4A4A4A; background: #1E1E1E; color: var(--ink); font: inherit; margin-bottom: 8px; }
  label { display: flex; gap: 6px; align-items: center; color: var(--muted); margin: 6px 0 10px; }
  .file { font-size: 11.5px; color: var(--ink); background: #1E1E1E; border: 1px solid var(--line); padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; overflow-wrap: anywhere; }
  .msg { margin-top: 8px; padding: 8px; border-left: 2px solid #666; background: var(--panel); color: var(--ink); white-space: pre-wrap; }
  .msg.err { border-left-color: var(--accent); }
  .msg.ok { border-left-color: #3FA36B; }
  .row { display: flex; gap: 6px; }
</style>
</head>
<body>
  <h1>InfoCut Bridge</h1>

  <section>
    <h2>1. 타임라인 가져오기</h2>
    <p>InfoCut 에서 [프리미어용으로 내보내기] 한 폴더의 XML 을 골라요.</p>
    <div class="file" id="xml">아직 고르지 않음</div>
    <div class="row">
      <button id="pick">XML 고르기</button>
      <button id="import" class="primary" disabled>가져와서 열기</button>
    </div>
  </section>

  <section>
    <h2>2. 자막을 MOGRT 템플릿으로</h2>
    <p>그림으로 들어간 자막(V3) 시간에 맞춰 템플릿을 V4 에 올리고 글자를 채워요. 글자 칸이 있는 자막·하단 자막 템플릿이 알맞아요.</p>
    <select id="mogrt"></select>
    <div class="row" style="margin-bottom:8px"><button id="pickMogrt">다른 .mogrt 고르기</button><button id="refresh">목록 새로고침</button></div>
    <label><input type="checkbox" id="hide" checked /> 그림 자막 트랙(V3) 숨기기</label>
    <button id="apply" class="primary" disabled>자막 적용</button>
  </section>

  <div id="msg"></div>

<script>
(function () {
  var fs = require('fs'), path = require('path'), os = require('os');
  var state = { xml: '', captions: null, extra: [] };
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'infocut-bridge';
  try { var saved = JSON.parse(localStorage.getItem(KEY) || '{}'); state.extra = saved.extra || []; state.lastDir = saved.lastDir || ''; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ extra: state.extra, lastDir: state.lastDir })); } catch (e) {} }

  function evalHost(script, cb) {
    window.__adobe_cep__.evalScript(script, function (res) {
      var out; try { out = JSON.parse(res); } catch (e) { out = { ok: false, error: res || '프리미어가 답하지 않았어요' }; }
      cb(out);
    });
  }
  function say(text, kind) { $('msg').innerHTML = ''; var d = document.createElement('div'); d.className = 'msg ' + (kind || ''); d.textContent = text; $('msg').appendChild(d); }
  function q(s) { return JSON.stringify(String(s)); }

  function pickFile(title, exts, cb) {
    var r = window.cep.fs.showOpenDialogEx(false, false, title, state.lastDir || '', exts);
    if (r && r.data && r.data.length) { state.lastDir = path.dirname(r.data[0]); save(); cb(r.data[0]); }
  }

  function loadXml(file) {
    state.xml = file;
    $('xml').textContent = path.basename(file);
    $('import').disabled = false;
    var cj = path.join(path.dirname(file), 'infocut_captions.json');
    if (fs.existsSync(cj)) {
      state.captions = fs.readFileSync(cj, 'utf8');
      var n = JSON.parse(state.captions).captions.length;
      say('자막 ' + n + '개를 찾았어요.', 'ok');
    } else { state.captions = null; say('같은 폴더에 infocut_captions.json 이 없어요. MOGRT 자막은 쓸 수 없어요.', 'err'); }
    $('apply').disabled = !state.captions || !$('mogrt').value;
  }

  function walk(dir, out, depth) {
    if (depth > 4 || !fs.existsSync(dir)) return;
    fs.readdirSync(dir).forEach(function (n) {
      var f = path.join(dir, n);
      try {
        var st = fs.statSync(f);
        if (st.isDirectory()) walk(f, out, depth + 1);
        else if (/\.mogrt$/i.test(n)) out.push(f);
      } catch (e) {}
    });
  }
  function listMogrts() {
    var appdata = process.env.APPDATA || path.join(os.homedir(), 'AppData', 'Roaming');
    var dirs = [path.join(appdata, 'Adobe', 'Common', 'Motion Graphics Templates'), path.join(os.homedir(), 'Library', 'Application Support', 'Adobe', 'Common', 'Motion Graphics Templates')];
    var all = [];
    dirs.forEach(function (d) { walk(d, all, 0); });
    state.extra.forEach(function (f) { if (fs.existsSync(f) && all.indexOf(f) < 0) all.unshift(f); });
    var sel = $('mogrt'); var cur = sel.value; sel.innerHTML = '';
    var caption = all.filter(function (f) { return /caption|subtitle|자막|lower third|하단/i.test(f); });
    var rest = all.filter(function (f) { return caption.indexOf(f) < 0; });
    function group(label, list) {
      if (!list.length) return;
      var g = document.createElement('optgroup'); g.label = label;
      list.forEach(function (f) { var o = document.createElement('option'); o.value = f; o.textContent = path.basename(f, '.mogrt'); g.appendChild(o); });
      sel.appendChild(g);
    }
    group('자막·하단 자막', caption); group('그 밖의 템플릿', rest);
    if (cur) sel.value = cur;
    if (!all.length) { var o = document.createElement('option'); o.textContent = 'MOGRT 를 찾지 못했어요'; o.value = ''; sel.appendChild(o); }
    $('apply').disabled = !state.captions || !sel.value;
  }

  $('pick').onclick = function () { pickFile('InfoCut XML 고르기', ['xml'], loadXml); };
  $('import').onclick = function () {
    say('가져오는 중');
    evalHost('infocut_importXML(' + q(state.xml) + ')', function (r) {
      say(r.ok ? '시퀀스를 열었어요: ' + r.sequence : '가져오지 못했어요: ' + r.error, r.ok ? 'ok' : 'err');
    });
  };
  $('pickMogrt').onclick = function () { pickFile('MOGRT 고르기', ['mogrt'], function (f) { if (state.extra.indexOf(f) < 0) state.extra.unshift(f); save(); listMogrts(); $('mogrt').value = f; }); };
  $('refresh').onclick = listMogrts;
  $('mogrt').onchange = function () { $('apply').disabled = !state.captions || !this.value; };
  $('apply').onclick = function () {
    var n = JSON.parse(state.captions).captions.length;
    say('자막 ' + n + '개에 템플릿을 올리는 중. 잠시만요.');
    $('apply').disabled = true;
    evalHost('infocut_applyMogrt(' + q($('mogrt').value) + ',' + q(state.captions) + ',3,' + ($('hide').checked ? 2 : -1) + ')', function (r) {
      $('apply').disabled = false;
      if (!r.ok) return say('적용하지 못했어요: ' + r.error, 'err');
      say('자막 ' + r.count + '개를 V4 에 올렸어요.' + (r.noText ? '\n' + r.noText + '개는 글자 칸을 찾지 못했어요. 글자 칸이 있는 자막 템플릿을 고르세요.' : ''), r.noText ? 'err' : 'ok');
    });
  };
  listMogrts();
})();
</script>
</body>
</html>
