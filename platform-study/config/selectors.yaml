# 연구 3 (추천 노출 감사) 선택자와 응답 패턴.
# 2026-11-25 첫 실행 때 실제 DOM과 페이지가 스스로 보낸 응답을 보고 채웠다.
# 사이트 개편으로 카드가 0개 잡히면 이 파일만 고치면 된다 (코드 수정 불필요).
#
# 원칙: 페이지가 스스로 보낸 응답만 읽는다. 직접 API를 호출하거나 서명을 흉내 내지 않는다.

common:
  viewport: {width: 1920, height: 1080}
  locale: ko-KR
  timezone_id: Asia/Seoul
  first_wait_ms: 8000          # 첫 화면 로드 후 대기
  home_scrolls: 3              # 첫 화면 + 스크롤 3번 = 화면 4장
  scroll_px: 1080
  seconds_between_scrolls: 30  # 스크롤마다 페이지가 같은 사이트에 요청을 보내므로 30초 규칙 적용
  baseline_max_minutes: 60     # 전체 라이브 목록 최대 수집 시간
  baseline_stall_scrolls: 3    # 새 방송이 3번 연속 안 늘면 끝으로 본다
  # 기준선 모드
  #   threshold(기본): 시청자순 목록을 50명 경계(동접 50 미만)가 나올 때까지만 내려
  #     50명 이상 방송 수를 정확히 세고, 전체 라이브 수는 아래 total_* 로 따로 구한다.
  #   full: 목록 끝까지 내린다 (검증용, 회차당 수십 분).
  baseline_mode: threshold
  threshold_extra_pages: 1     # 경계를 넘은 뒤 한 번 더 내려 경계 근처를 확실히 담는다

chzzk:
  home_url: "https://chzzk.naver.com/"
  baseline_url: "https://chzzk.naver.com/lives"   # 기본 정렬이 '추천순'이라 시청자순 버튼을 눌러야 한다
  baseline_sort_button: 'button:text-is("시청자순")'
  baseline_sort_fallback_open: 'button:text-is("추천순")'
  # 카드: /live/{32자리 채널 ID} 링크
  card_link: 'a[href^="/live/"]'
  channel_id_regex: '/live/([0-9a-f]{32})'
  # 섹션 제목: 카드에서 가장 가까운 section의 제목 요소. 해시 클래스라서 부분 일치로 잡는다
  section_container: "section"
  section_title: '[class*="_title_"], h2, h3, strong'
  # 카드 수치(동접·카테고리·공식 여부)는 페이지가 받은 응답에서 채널 ID로 찾는다
  home_response_patterns:
    - "api.chzzk.naver.com/service/v2/topics/HOME/sub-topics/HOME/main"
  baseline_response_patterns:
    - "api.chzzk.naver.com/service/v1/lives?"     # sortType=POPULAR 응답만 쓴다 (코드에서 거름)
  baseline_required_param: "sortType=POPULAR"
  # 전체 라이브 수: 카테고리 페이지가 받는 카테고리별 openLiveCount 합 (카테고리 없는 방송은 빠지므로 하한)
  total_url: "https://chzzk.naver.com/category"
  total_response_patterns:
    - "api.chzzk.naver.com/service/v1/categories/live?"

soop:
  home_url: "https://www.sooplive.com/"
  baseline_url: "https://www.sooplive.com/live/all"
  card_link: '[data-type="cBox"] .thumbs-box a[href*="play.sooplive.com"]'  # li(그리드)와 div(캐러셀) 둘 다
  card_container: '[data-type="cBox"]'
  channel_id_regex: 'play\.sooplive\.com/([^/]+)/(\d+)'
  viewers: '[data-testid="view-count"]'
  nick: '.nick span, .nick'
  category: '.tag_wrap a.category'      # 첫 번째는 언어, 두 번째가 카테고리
  section_container: "section"
  section_title: "h2"
  home_response_patterns: []            # 숲 홈 카드는 DOM에 수치가 다 있어서 응답이 필요 없다
  # 첫 페이지는 정적 JSON 파일, 이후는 '더보기' 버튼으로 pageNo가 늘어난다 (orderType=view_cnt = 시청자순)
  baseline_response_patterns:
    - "static.file.sooplive.com/pc/ko_KR/main_broad_list"
    - "api-live.sooplive.com/api/v1/live/broadcast-main-list"
  load_more_button: 'button:text-is("더보기")'
  # 전체 라이브 수: 목록 응답의 total_cnt / totalCount

# 공식·중계 채널 판정. 치지직은 응답의 officialChannel/verifiedMark를 우선 쓰고,
# 둘 다 없으면 아래 이름 규칙을 쓴다 (숲은 이름 규칙만 가능).
official_name_patterns:
  - "공식"
  - "official"
  - "LCK"
  - "JTBC"
  - "YTN"
  - "연합뉴스"
  - "한국경제TV"
  - "KBS"
  - "MBC"
  - "SBS"
  - "스브스"
  - "SPOTV"
  - "T1"

block_markers:
  - "captcha"
  - "CAPTCHA"
  - "비정상적인 접근"
  - "Access Denied"
  - "Too Many Requests"
